name: Omni Tuya valve on Home Assistant Core

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  core-valve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: home-assistant/core
          ref: 2026.10.0
          path: home-assistant-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.2'
      - name: Install Home Assistant Core 2026.10.0 test dependencies
        run: |
          python -m pip install uv==0.12.19
          cd home-assistant-core
          uv pip install --system -r requirements.txt -r requirements_test.txt
          uv pip install --system -e . --no-deps
      - name: Test native valve API and local commands against Core
        run: PYTHONPATH="$GITHUB_WORKSPACE" python -m pytest -q tests_core/test_valve_platform.py
